<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Counter Map - Local DB</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    
    <!-- CARICHIAMO IL DATABASE ESTERNO QUI -->
    <script src="database.js"></script>

    <style>
        :root {
            --primary: #00ffcc;
            --bg: #0b0c10;
            --surface: #1f2833;
            --surface-card: #16213e;
            --red-glow: #ff0055;
            --zero-color: #1f2833;
            --text-muted: #8892b0;
        }

        @media (min-width: 851px) {
            .main-wrapper { flex-direction: row !important; align-items: flex-start !important; gap: 40px !important; }
            .map-container { width: 700px !important; height: 500px !important; }
            .dashboard { width: 320px !important; }
        }

        * { box-sizing: border-box; touch-action: manipulation; }
        body { margin: 0; padding: 15px; background-color: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow-x: hidden; user-select: none; }
        header { text-align: center; margin-bottom: 15px; }
        h1 { margin: 0 0 5px 0; font-size: clamp(1.4rem, 4vw, 2.2rem); color: #fff; text-shadow: 0 0 12px var(--primary); }
        .subtitle { color: var(--text-muted); margin: 0; font-size: clamp(0.8rem, 2.5vw, 0.95rem); max-width: 600px; }
        
        .main-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; width: 100%; max-width: 1200px; }
        .map-section { display: flex; flex-direction: column; align-items: center; gap: 12px; position: relative; }
        .map-container { width: 90vw; height: 350px; background: var(--surface-card); border-radius: 15px; border: 1px solid rgba(0, 255, 204, 0.3); box-shadow: 0 0 25px rgba(0, 0, 0, 0.7); overflow: hidden; position: relative; cursor: grab; }
        .map-container:active { cursor: grabbing; }
        svg { width: 100%; height: 100%; }
        
        .country { stroke: rgba(0, 255, 204, 0.2); stroke-width: 0.5px; transition: fill 0.3s ease, stroke 0.2s ease; }
        .country:hover { stroke: var(--primary); stroke-width: 1.5px; filter: brightness(1.2); }
        
        .zoom-controls { position: absolute; top: 15px; right: 15px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
        .btn-zoom { width: 36px; height: 36px; background: var(--surface); color: var(--primary); border: 1px solid var(--primary); border-radius: 8px; font-size: 1.2rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: all 0.2s; }
        .btn-zoom:hover { background: var(--primary); color: var(--bg); box-shadow: 0 0 12px var(--primary); }
        
        .dashboard { display: flex; flex-direction: column; align-items: center; gap: 15px; background: var(--surface-card); padding: 20px 25px; border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 90vw; }
        .dashboard-title { font-size: 1.1rem; font-weight: bold; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; margin: 0; }
        .leaderboard { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        
        .rank-card { display: flex; align-items: center; justify-content: space-between; background: var(--surface); padding: 10px 15px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.05); transition: transform 0.2s; }
        .rank-card:hover { transform: translateX(3px); border-color: rgba(0, 255, 204, 0.3); }
        .rank-info { display: flex; align-items: center; gap: 12px; }
        .badge { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.85rem; }
        .rank-1 .badge { background: #ffd700; color: #000; box-shadow: 0 0 8px #ffd700; }
        .rank-2 .badge { background: #c0c0c0; color: #000; box-shadow: 0 0 8px #c0c0c0; }
        .rank-3 .badge { background: #cd7f32; color: #000; box-shadow: 0 0 8px #cd7f32; }
        
        .country-name { font-size: 0.95rem; font-weight: 600; }
        .counter-val { font-size: 1.1rem; font-weight: bold; color: var(--red-glow); text-shadow: 0 0 8px var(--red-glow); }
        
        .tooltip { position: absolute; padding: 8px 12px; background: rgba(11, 12, 16, 0.9); border: 1px solid var(--primary); border-radius: 6px; color: #fff; font-size: 0.85rem; pointer-events: none; display: none; z-index: 100; box-shadow: 0 0 10px rgba(0, 255, 204, 0.3); }

        /* --- STILE NUOVO PULSANTE --- */
        .play-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 20px;
            width: 100%;
            text-align: center;
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .play-btn:hover {
            background: var(--primary);
            color: var(--bg);
            box-shadow: 0 0 15px var(--primary);
        }
    </style>
</head>
<body>

    <header>
        <h1>Global Counter Heatmap</h1>
        <p class="subtitle" id="status-text">Monitoraggio offline attivo</p>
    </header>

    <div class="main-wrapper">
        <div class="map-section">
            <div class="map-container" id="map-holder">
                <div class="zoom-controls">
                    <button class="btn-zoom" id="zoom-in">+</button>
                    <button class="btn-zoom" id="zoom-out">−</button>
                    <button class="btn-zoom" id="zoom-reset">⟲</button>
                </div>
                <svg id="world-map"></svg>
            </div>
        </div>

        <div class="dashboard">
            <h2 class="dashboard-title">Top 3 Paesi</h2>
            <div class="leaderboard" id="leaderboard-content">
                <!-- Verrà popolato dinamicamente -->
            </div>
            
            <!-- NUOVO PULSANTE -->
            <a href="https://www.drammis.net/game" class="play-btn" target="_blank">Play for free</a>
        </div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script>
        // Controlliamo che il database.js sia stato caricato correttamente
        if (typeof databaseEsterno === 'undefined') {
            document.getElementById('status-text').innerHTML = `<span style="color:var(--red-glow)">Errore: File database.js non trovato!</span>`;
            window.databaseEsterno = {}; 
        }

        // Traduzioni automatiche dei nomi dei paesi dall'inglese all'italiano
        const traduzioniITA = {
            "United States of America": "Stati Uniti",
            "China": "Cina",
            "Japan": "Giappone",
            "India": "India",
            "Italy": "Italia",
            "Brazil": "Brasile",
            "Russia": "Russia",
            "Germany": "Germania",
            "France": "Francia",
            "United Kingdom": "Regno Unito",
            "South Africa": "Sudafrica",
            "Spain": "Spagna",
            "Australia": "Australia",
            "Canada": "Canada"
        };

        const counters = Object.values(databaseEsterno);
        const maxCounter = counters.length > 0 ? Math.max(...counters, 10) : 100;

        function getCountryColor(val) {
            if (!val || val === 0) return "var(--zero-color)";
            const ratio = val / maxCounter;
            return d3.interpolateRgb("#3d0c1e", "#ff0055")(ratio);
        }

        // Inizializzazione Mappa D3
        const svg = d3.select("#world-map");
        const container = document.getElementById("map-holder");
        const g = svg.append("g");
        const projection = d3.geoMercator().scale(container.clientWidth / 6.5).translate([container.clientWidth / 2, container.clientHeight / 1.5]);
        const path = d3.geoPath().projection(projection);

        const zoom = d3.zoom().scaleExtent([1, 8]).on("zoom", (event) => g.attr("transform", event.transform));
        svg.call(zoom);
        d3.select("#zoom-in").on("click", () => svg.transition().duration(300).call(zoom.scaleBy, 1.3));
        d3.select("#zoom-out").on("click", () => svg.transition().duration(300).call(zoom.scaleBy, 0.7));
        d3.select("#zoom-reset").on("click", () => svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity));

        const tooltip = d3.select("#tooltip");

        // Scarichiamo SOLO i confini della mappa
        d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(topology => {
            const countries = topojson.feature(topology, topology.objects.countries).features;

            g.selectAll("path")
                .data(countries)
                .enter()
                .append("path")
                .attr("class", "country")
                .attr("d", path)
                .attr("fill", d => {
                    const nomeEng = d.properties.name;
                    const val = databaseEsterno[nomeEng] || 0;
                    return getCountryColor(val);
                })
                .on("mouseover", (event, d) => {
                    const nomeEng = d.properties.name;
                    const val = databaseEsterno[nomeEng] || 0;
                    const nomeVisualizzato = traduzioniITA[nomeEng] || nomeEng;

                    tooltip.style("display", "block").html(`<strong>${nomeVisualizzato}</strong><br/>Counter: <span style="color:var(--primary)">${val}</span>`);
                })
                .on("mousemove", (event) => tooltip.style("left", (event.pageX + 10) + "px").style("top", (event.pageY - 28) + "px"))
                .on("mouseout", () => tooltip.style("display", "none"));

            aggiornaClassifica();
        }).catch(err => console.error("Errore nel caricare la mappa vettoriale:", err));

        // Genera Classifica Top 3
        function aggiornaClassifica() {
            const sorted = Object.entries(databaseEsterno).sort((a, b) => b[1] - a[1]).slice(0, 3);
            const containerLeaderboard = document.getElementById("leaderboard-content");
            containerLeaderboard.innerHTML = "";

            sorted.forEach(([nomeEng, val], index) => {
                const countryName = traduzioniITA[nomeEng] || nomeEng;
                containerLeaderboard.innerHTML += `
                    <div class="rank-card rank-${index + 1}">
                        <div class="rank-info">
                            <div class="badge">${index + 1}</div>
                            <span class="country-name">${countryName}</span>
                        </div>
                        <span class="counter-val">${val}</span>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
